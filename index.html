<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6at Wedding · Pink Party Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--pink:#efa4b5;--paper:#fffaf9;--ink:#30272a;--line:rgba(48,39,42,.16);--black:#181616}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3eeee;color:var(--ink)}
body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased} button{font:inherit;color:inherit}
.app{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#f6f1f0,#eee9e7)}
.stage{position:absolute;inset:0;display:flex;transition:transform .72s cubic-bezier(.22,.8,.22,1);will-change:transform}
.chapter{position:relative;flex:0 0 100%;height:100%;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.phone{position:relative;width:min(430px,100%);height:min(880px,100%);max-height:calc(100dvh - 24px);background:var(--paper);border:1px solid rgba(30,20,20,.12);border-radius:34px;overflow:hidden;box-shadow:0 20px 55px rgba(43,31,32,.12);transition:opacity .45s ease,transform .55s cubic-bezier(.22,.8,.22,1)}
.chapter:not(.active) .phone{opacity:.35;transform:scale(.96)} .chapter.active .phone{opacity:1;transform:scale(1)}
.topline{position:absolute;top:20px;left:24px;right:24px;z-index:10;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(48,39,42,.65)}
.counter{font-family:"Cormorant Garamond",serif;font-size:14px}.sound{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.72);display:grid;place-items:center;backdrop-filter:blur(8px)}
.sound svg{width:15px;height:15px}.next-btn{border:0;background:transparent;padding:12px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.arrow{display:inline-block;margin-left:14px}
.progress{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:50;transform:translateX(-50%);display:flex;gap:8px;padding:9px 12px;border-radius:30px;background:rgba(255,255,255,.68);backdrop-filter:blur(12px)}
.progress button{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:#c8bfc0}.progress button.active{width:22px;border-radius:10px;background:var(--black)}
.hint{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);z-index:40;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(48,39,42,.52)}
.open-page{background:linear-gradient(180deg,#fff9fa 0 55%,#f5d3dc 55%)}
.open-copy{position:absolute;top:13%;left:0;right:0;text-align:center;z-index:3}.eyebrow{font-size:10px;letter-spacing:.22em;margin-bottom:22px}
.open-copy h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(42px,10vw,64px);line-height:.87;margin:0}.date{margin-top:22px;font-size:10px;letter-spacing:.16em}
.envelope{position:absolute;left:0;right:0;bottom:0;height:47%;background:linear-gradient(145deg,#eda8b8,#f4bdc9);clip-path:polygon(0 12%,50% 55%,100% 12%,100% 100%,0 100%)}
.seal{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecebea,#a9aaa8 60%,#777876);border:3px double #d8d8d5;box-shadow:0 8px 20px rgba(40,30,30,.18);display:grid;place-items:center;z-index:5;font-family:"Cormorant Garamond",serif;font-size:20px;color:#4b4b49}
.open-trigger{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:7;border:0;background:transparent;font-size:11px;letter-spacing:.18em;color:white;text-transform:uppercase}.open-trigger span{display:block;font-size:20px;animation:bob 1.5s infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.open-page.opened .envelope{animation:envelopeDown .7s ease forwards}.open-page.opened .seal{animation:sealPop .55s ease forwards}@keyframes envelopeDown{to{transform:translateY(54%);opacity:.18}}@keyframes sealPop{to{transform:translate(-50%,30px) scale(.75);opacity:0}}
.invite-page{display:flex;flex-direction:column;background:#fffaf9}.invite-photo{height:43%;min-height:300px;overflow:hidden;position:relative;background:#e8d9da}.invite-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.82)}
.invite-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 34px 58px;text-align:center}.invite-body h2{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:37px;margin:0 0 22px;color:#b76076}.invite-body p{font-size:13px;line-height:2;margin:0}.invite-meta{margin-top:24px;font-family:"Cormorant Garamond",serif;font-size:17px;line-height:1.45;letter-spacing:.08em}.invite-next{margin-top:auto;align-self:flex-end}
.place-page{background:#fffafa;display:flex;flex-direction:column;align-items:center;text-align:center;padding:88px 18px 50px}.place-page h2{font-family:"Cormorant Garamond",serif;font-size:31px;line-height:1.05;font-weight:500;margin:18px 0}.reveal-text{margin:18px 0 24px;border:0;background:transparent;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.reveal-text span{display:block;font-size:18px;margin-top:8px}.place-card{width:100%;flex:1;min-height:350px;border-radius:24px;overflow:hidden;position:relative;background:#171515;transform:translateY(40px);opacity:.2;filter:blur(9px);transition:.75s cubic-bezier(.2,.8,.2,1)}.place-card.revealed{transform:none;opacity:1;filter:none}.place-card img{width:100%;height:100%;object-fit:cover;filter:brightness(.76) saturate(.85)}.place-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75))}.place-caption{position:absolute;left:18px;right:18px;bottom:26px;z-index:3;color:white}.place-caption strong{display:block;font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:400}.place-caption small{display:block;margin-top:8px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;color:#f7dce2}
@media(max-width:520px){.chapter{padding:0}.phone{width:100%;height:100%;max-height:none;border-radius:0;border:0;box-shadow:none}.progress{bottom:max(10px,env(safe-area-inset-bottom))}.hint{bottom:48px}.topline{top:max(18px,env(safe-area-inset-top))}.invite-photo{height:44%}.invite-body{padding-bottom:64px}.place-page{padding-top:max(78px,calc(env(safe-area-inset-top) + 58px));padding-bottom:64px}}
</style>
</head>
<body>
<main class="app">
<div class="stage" id="stage">
<section class="chapter active"><article class="phone open-page" id="openPage"><div class="topline"><span class="counter">01 / 03</span><button class="sound" aria-label="sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 10v4h4l5 4V6L9 10H5z"/></svg></button></div><div class="open-copy"><div class="eyebrow">YOU'RE INVITED</div><h1>MINA<br>&amp;<br>JUN</h1><div class="date">OCTOBER 17, 2026</div></div><div class="envelope"></div><div class="seal">M / J</div><button class="open-trigger" id="openTrigger">OPEN ME<span>⌃</span></button></article></section>
<section class="chapter"><article class="phone invite-page"><div class="topline"><span class="counter">02 / 03</span><button class="sound" aria-label="sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 10v4h4l5 4V6L9 10H5z"/></svg></button></div><div class="invite-photo"><img src="../images/main.jpeg" alt="Wedding couple"></div><div class="invite-body"><h2>A little wedding</h2><p>많은 사람들 앞에서보다<br>좋아하는 사람들과 가까이 앉아<br>오래 저녁을 보내기로 했습니다.</p><div class="invite-meta">40 PEOPLE<br>ONE LONG TABLE</div><button class="next-btn invite-next" data-next>Next <span class="arrow">→</span></button></div></article></section>
<section class="chapter"><article class="phone place-page"><div class="topline"><span class="counter">03 / 03</span><button class="sound" aria-label="sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 10v4h4l5 4V6L9 10H5z"/></svg></button></div><h2>WHERE ARE WE<br>GETTING MARRIED?</h2><button class="reveal-text" id="revealBtn">Tap to reveal<span>⌄</span></button><div class="place-card" id="placeCard"><img src="../images/space.jpeg" alt="Wedding venue"><div class="place-caption"><strong>OO RESTAURANT · SEOUL</strong><small>We saved you a seat.</small></div></div></article></section>
</div>
<div class="hint">tap · swipe</div><nav class="progress"><button class="active" data-go="0"></button><button data-go="1"></button><button data-go="2"></button></nav>
</main>
<script>
(()=>{const stage=document.getElementById('stage'),chapters=[...document.querySelectorAll('.chapter')],dots=[...document.querySelectorAll('[data-go]')],openPage=document.getElementById('openPage'),openTrigger=document.getElementById('openTrigger'),revealBtn=document.getElementById('revealBtn'),placeCard=document.getElementById('placeCard');let index=0,startX=0,startY=0,locked=false;function go(n){index=Math.max(0,Math.min(chapters.length-1,n));stage.style.transform=`translate3d(${-index*100}%,0,0)`;chapters.forEach((e,i)=>e.classList.toggle('active',i===index));dots.forEach((e,i)=>e.classList.toggle('active',i===index))}function next(){if(index<chapters.length-1)go(index+1)}function prev(){if(index>0)go(index-1)}openTrigger.addEventListener('click',()=>{if(locked)return;locked=true;openPage.classList.add('opened');setTimeout(()=>{go(1);locked=false},620)});document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',next));dots.forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.go))));revealBtn.addEventListener('click',()=>{placeCard.classList.add('revealed');revealBtn.innerHTML='Our place<span>⌄</span>'});stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:true});stage.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.2)(dx<0?next():prev())},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()})})();
</script>
</body>
</html>
